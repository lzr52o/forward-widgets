#!name=V2EX 签到
#!desc=每日领取铜币 · Cookie 自动抓取
#!author=凉心
#!category=凉心Tools

# V2EX 签到 - Quantumult X 版
# 由 Surge 模块转换而来
# 原模块：https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Surge/v2ex.sgmodule

# 使用方法：
# 1. 把下面 [rewrite_local] 里的 User 替换成你的 V2EX 用户名
#    比如你的用户名是 testuser，就把 .* 改成 testuser
# 2. QX 里添加这个重写规则，开启 MitM，hostname 已包含 www.v2ex.com
# 3. 首次使用：打开 V2EX 个人主页 https://www.v2ex.com/member/你的用户名 ，让脚本抓取 Cookie
# 4. 之后每天 00:10 自动签到

[rewrite_local]
# 抓取 Cookie：访问个人主页时触发
^https?:\/\/www\.v2ex\.com\/member\/.* url script-request-header https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Scripts/v2ex.js

[task_local]
# 每日签到：每天 00:10 执行
10 0 * * * https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Scripts/v2ex.js, tag=V2EX 签到, img-url=https://raw.githubusercontent.com/52Lxcloud/ScriptKit/main/Scripts/v2ex.png, enabled=true

[mitm]
hostname = www.v2ex.com
